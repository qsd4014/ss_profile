provider-template: &provider-template
  type: http
  proxy: DIRECT
  interval: 1800
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300

proxy-providers:
  # 1. 主订阅
  subscription_main:
    <<: *provider-template
    url: "一号地址"
  #  override:
  #    additional-prefix: "[主]"
    exclude-filter: "(?i)落地"

  # 2. 落地专用订阅
  subscription_landing:
    <<: *provider-template
    url: "落地地址"
    override:
      additional-prefix: "[链式]"
      dialer-proxy: 中转-枢纽
    filter: "(?i)落地"

mode: rule
port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: info

geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

external-controller: 0.0.0.0:9095
secret: "9V26Mzb7v3jsjZgDXWGgbkmG1XDjs5wb"
external-ui: "/etc/openclash/run/ui"
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-controller-cors:
  allow-private-network: true
  allow-origins:
    - "*"

find-process-mode: strict
global-client-fingerprint: firefox
keep-alive-idle: 60
keep-alive-interval: 30

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.mi.com"

tun:
  enable: false
  stack: mixed
  mtu: 9000
  dns-hijack:
    - any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stuns.*.*"
    - "+.stuns.*.*.*"
    - "+.wns.windows.com"
    - "+.msftncsi.com"
    - "+.msftconnecttest.com"
    - "rule-set:private_domain,cn_domain"
  nameserver-policy:
    rule-set:private_domain,cn_domain:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - quic://223.5.5.5
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

# --- 模板定义 ---
proxy-templates: &proxy-templates
  type: select
  proxies:
    - 精选-低倍率
    - Snippets
    - 美国
    - 美国自动
    - 香港
    - 香港自动
    - 日本
    - 台湾
    - 新加坡
    - AI-落地-链式
    - 全部
    - DIRECT

proxy-groups:
  - name: 默认
    type: select
    proxies:
      - Emby-Proxy
      - AI-Services
      - Snippets
      - 精选-低倍率
      - 美国
      - 美国自动
      - 香港
      - 香港自动
      - 日本
      - 台湾
      - 新加坡
      - 全部
      - DIRECT

  - name: 拦截-广告
    type: select
    proxies:
      - REJECT
      - DIRECT

  # --- 特殊服务 ---
  - name: Emby-Direct
    type: select
    proxies:
      - DIRECT
      - 精选-低倍率
      - Snippets
      - 全部

  - name: Emby-Proxy
    type: select
    proxies:
      - 精选-低倍率
      - Snippets
      - 全部
      - DIRECT

  - name: AI-Services
    type: select
    proxies:
      - AI-落地-链式
      - 美国
      - 美国自动

  # --- 新增/细化策略组 (仿Sing-box) ---
  
  - name: TikTok
    <<: *proxy-templates

  - name: Bilibili
    <<: *proxy-templates
    # Sing-box里B站一般指国际版或港澳台，所以可以默认选直连或香港
    proxies:
      - DIRECT
      - 香港
      - 台湾

  - name: Telegram
    <<: *proxy-templates

  - name: Twitter
    <<: *proxy-templates

  - name: Facebook
    <<: *proxy-templates

  - name: Bing
    <<: *proxy-templates

  - name: AppleTV
    type: select
    proxies:
      - DIRECT
      - 精选-低倍率
      - Snippets
      - 美国
      - 香港
      - 日本
        
  - name: 🎮 游戏平台
    type: select
    proxies:
      - 精选-低倍率 
      - 全部
      - 美国
      - 香港
      - 日本
      - DIRECT 

  # --- 核心链路 ---
  - name: 中转-枢纽
    type: select
    proxies:
      - 香港
      - 香港自动
      - 新加坡
      - 美国
      - 美国自动
      - 日本
      - 台湾

  - name: AI-落地-链式
    type: select
    use:
      - subscription_landing

  - name: 精选-低倍率
    type: select
    use:
      - subscription_main
    filter: "(?i)(0\\.\\d+x|直连|my|Snippets)"
    exclude-filter: "(?i)(home|家宽|(^|[^0-9\\.])([1-9]\\d*(\\.\\d+)?x))"
      
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - 精选-低倍率
      - 美国
      - 香港
      - 日本
  # --- 常规应用 ---
  - name: YouTube
    <<: *proxy-templates
  - name: GitHub
    <<: *proxy-templates
  - name: Netflix
    <<: *proxy-templates
  - name: LinuxDo
    <<: *proxy-templates
  - name: Google
    <<: *proxy-templates
  - name: Microsoft
    <<: *proxy-templates
  - name: Disney+
    <<: *proxy-templates
  - name: Final
    <<: *proxy-templates

  # --- 地区 ---
  - name: 美国
    type: select
    use:
      - subscription_main
    filter: "(?=.*?(美国|美|美利坚|US|USA|(?i)States|(?i)America)).*$"

  - name: 美国自动
    type: url-test
    use:
      - subscription_main
    tolerance: 200
    interval: 300
    filter: "(?=.*?(美国|美|美利坚|US|USA|(?i)States|(?i)America)).*$"
    exclude-filter: "(?i)(1\\.[1-9]x|[2-9](\\.\\d+)?x|\\d{2,}x)"

  - name: 香港
    type: select
    use:
      - subscription_main
    filter: "(?=.*?(香港|港|HK|Hong Kong|Hongkong|HKSAR)).*$"

  - name: 香港自动
    type: url-test
    use:
      - subscription_main
    tolerance: 100
    interval: 300
    filter: "(?=.*?(香港|港|HK|Hong Kong|Hongkong|HKSAR)).*$"
    exclude-filter: "(?i)(1\\.[1-9]x|[2-9](\\.\\d+)?x|\\d{2,}x)"

  - name: 日本
    type: select
    use:
      - subscription_main
    filter: "(?=.*?(日本|日|Japan|Nippon|JP|Japanese)).*$"

  - name: 台湾
    type: select
    use:
      - subscription_main
    filter: "(?=.*?(台湾|台|Taiwan|TW|ROC|Republic of China|Chinese Taipei)).*$"

  - name: 新加坡
    type: select
    use:
      - subscription_main
    filter: "(?=.*?(新加坡|新|Singapore|SG|Singapura)).*$"

  - name: 全部
    type: select
    use:
      - subscription_main
    exclude-filter: "(?=.*?(流量|剩余|期|company-network)).*$"

  # --- 新增的 Snippets 策略组 ---
  - name: Snippets
    type: url-test
    use:
      - subscription_main
    filter: "(?=.*?(Snippets)).*$"
    tolerance: 300
    interval: 300

rules:
  # 1. 优先级最高：私有/去广告/直连白名单
  - DOMAIN-SUFFIX,linux.do,LinuxDo
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,ads_domain,拦截-广告
  - RULE-SET,cn_ip,DIRECT,no-resolve

  # --- 电商 & 国内游戏 (直连区) ---
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,taobao_domain,DIRECT
  - RULE-SET,jd_domain,DIRECT
  - RULE-SET,pinduoduo_domain,DIRECT
  - RULE-SET,alibaba_ip,DIRECT,no-resolve
  - RULE-SET,tencent_ip,DIRECT,no-resolve

  # 【关键】国内游戏/下载 -> 直连
  # 这条规则会把 Steam 的下载服务器 (steamcontent.com 等) 拦截并直连
  - RULE-SET,games_cn,DIRECT

  # 2. 特殊应用
  - RULE-SET,emby_direct,Emby-Direct
  - RULE-SET,emby_proxy,Emby-Proxy
  - RULE-SET,custom_direct,DIRECT
  # 3. AI 服务 (OpenAI, Claude, Gemini, Perplexity等全包含)
  - RULE-SET,ai_chat_domain,AI-Services
  
  # 4. 社交与媒体 (新增部分)
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,bilibili_domain,Bilibili
  - RULE-SET,twitter_domain,Twitter
  - RULE-SET,facebook_domain,Facebook
  - RULE-SET,facebook_ip,Facebook
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,telegram_ip,Telegram
  
  # 5. 常规媒体
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,netflix_domain,Netflix
  - RULE-SET,netflix_ip,Netflix,no-resolve
  - RULE-SET,disney_domain,Disney+
    
  # --- 游戏平台 (代理区) ---
  # 剩下的 Steam 流量 (商店/社区) -> 走代理
  - RULE-SET,steam_domain,🎮 游戏平台
  - RULE-SET,epic_domain,🎮 游戏平台
  - RULE-SET,blizzard_domain,🎮 游戏平台
  - RULE-SET,ea_domain,🎮 游戏平台
  - RULE-SET,nintendo_domain,🎮 游戏平台

  # 6. 工具与服务
  - RULE-SET,github_domain,GitHub
  - RULE-SET,bing_domain,Bing
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,google_domain,Google
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,appletv_domain,AppleTV
  - RULE-SET,apple_domain,Apple
  # 7. 兜底
  - MATCH,Final

rule-templates:
  ip-template: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs
  domain-template: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs
  list-template: &list-rule
    type: http
    interval: 86400
    behavior: classical
    format: text

